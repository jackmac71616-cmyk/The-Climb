<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Climb">
<meta name="theme-color" content="#EFEBE2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>The Climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EFEBE2; --surface:#FBF9F4; --ink:#1B1A17; --muted:#625E56; --line:#DAD3C6;
  --accent:#1F46C8; --accent-ink:#FFFFFF; --accent-soft:#DCE3F8;
  --good:#23794A; --warn:#B26A0A; --bad:#B8322F;
  --plate-red:#C8312B; --plate-blue:#1F46C8; --plate-yellow:#D9A514; --plate-green:#2E8B4E;
  --sky:#CFE3F5; --mtn-back:#A7BBD0; --mtn:#7C93B0; --mtn-shade:#647B99; --snow:#FFFFFF; --grass:#86BC73; --tree:#2F7D4F; --outline:#1C2A3A; --cloud:#FFFFFF; --trail:#F1E2BF; --blob:#F7A15E;
  --topo:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 320 320'><g fill='none' stroke='rgba(31,70,200,0.07)' stroke-width='1.3'><path d='M0 38 C 53 8, 107 68, 160 38 S 267 68, 320 38'/><path d='M0 64 C 53 36, 107 92, 160 64 S 267 92, 320 64'/><path d='M0 92 C 53 66, 107 118, 160 92 S 267 118, 320 92'/><ellipse cx='228' cy='228' rx='74' ry='46'/><ellipse cx='228' cy='228' rx='50' ry='30'/><ellipse cx='228' cy='228' rx='26' ry='14'/><ellipse cx='70' cy='210' rx='44' ry='28'/><ellipse cx='70' cy='210' rx='20' ry='12'/></g></svg>");
  --shadow:0 1px 0 rgba(20,30,50,.04), 0 8px 22px -14px rgba(20,30,50,.35);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--topo) repeat, var(--bg);background-color:var(--bg);color:var(--ink);font:15.5px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 104px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:38px}
h2{font-size:23px}
h3{font-size:19px}
b,strong{font-weight:800}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.datenav{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* banner */
.banner{border-left:4px solid var(--warn);background:var(--surface);border-radius:0 10px 10px 0;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.banner.good{border-left-color:var(--good)}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner li{margin:2px 0}

/* meters */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:5px}
.progress-ring{display:flex;align-items:center;gap:14px}

/* checklist */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;margin:1px 0 0;display:grid;place-items:center;background:var(--surface)}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:disabled{cursor:default}
.task .t{font-weight:600}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.task .d{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
.chip.mk{background:var(--warn);color:var(--surface)}
.chip.auto{background:var(--accent-soft);color:var(--accent)}
.chip.pri{background:var(--bad);color:var(--surface)}

/* food */
.food-form{display:grid;grid-template-columns:1fr 78px 64px auto;gap:8px}
.food-form input{min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.card > h2 + .task,.card > h2 + .bday{border-top:0}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.foods{list-style:none;margin:0;padding:0}
.foods li{display:grid;grid-template-columns:1fr auto auto 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.foods li:first-child{border-top:0}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:6px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;resize:vertical}
.climb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.climb-stats div{display:flex;flex-direction:column;gap:2px}
.climb-stats b{font-size:16px}
.verse{font-family:var(--display);font-size:23px;line-height:1.2;font-weight:400;text-wrap:balance}
.bday{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.bday:first-child{border-top:0}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.ok{background:var(--good);color:var(--surface)}
.bottles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;justify-items:center}
.bottles figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.size[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.water-btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.mark-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line);padding-block:10px 0}
.markbtn{width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;color:var(--muted)}
.markbtn.y[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.markbtn.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.segs::-webkit-scrollbar{display:none}
.seg{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.seg[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.how{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.label + .how{border-top:0}
.how-n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.how p{font-size:14px;margin-top:2px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.brand img{border-radius:7px;box-shadow:0 0 0 1.5px var(--outline)}
.strip{display:grid;grid-template-columns:repeat(14,minmax(34px,1fr));gap:4px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;background:var(--bg)}
.sday.now{background:var(--ink);color:var(--bg)}
.sday.now .label{color:var(--bg)}
.sdots{display:flex;gap:2px;height:8px}
.sdots i{width:8px;height:8px;border-radius:50%;display:block}
.sdots i.study{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.sday.now .sdots i.study{box-shadow:inset 0 0 0 2px var(--bg)}
.aform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.assess{display:grid;grid-template-columns:5px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.card > h2 + .assess{border-top:0}
.abar{align-self:stretch;border-radius:3px}
.assess.past{opacity:.85}
.grade{width:74px;padding:7px 8px}
.markbtn.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-8deg)}40%{transform:translateX(4px) rotate(7deg)}60%{transform:translateX(-3px) rotate(-4deg)}80%{transform:translateX(2px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.markbtn.shake{animation:none}}
.savesleep{width:100%}
.savesleep.saved{background:var(--good);border-color:var(--good);color:#fff;opacity:1;cursor:default}
.savesleep:disabled{cursor:default}
.checkin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkin label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.checkin input,.checkin select{min-width:0;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}

/* plan tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td.num{white-space:nowrap}
.week{display:grid;gap:8px}
.phases{display:grid;gap:10px}
.phase{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.phase.now{border-color:var(--accent);background:var(--accent-soft)}
.wday{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wday:first-child{border-top:0}
.wday .dn{font-family:var(--display);font-weight:700;font-size:20px}
.wday.today .dn{color:var(--accent)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details[open] summary::after{content:"–"}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plate{border-radius:8px;padding:10px;color:#fff;text-align:center}
.plate b{display:block;font-family:var(--display);font-size:24px;line-height:1}
.plate span{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.prose{display:flex;flex-direction:column;gap:8px}
.prose ul{margin:0;padding-left:18px}
.prose li{margin:3px 0}

/* history */
.hist li{grid-template-columns:82px 1fr 50px 40px 40px 48px}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li>span{white-space:nowrap}
.hist li{display:grid;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.hist li:first-child{border-top:0}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini>i{display:block;height:100%}
svg text{fill:var(--muted);font:11px var(--mono)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.settings input{min-width:0;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(8,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:0;color:var(--muted)}
nav.tabs svg{width:40px;height:28px;padding:4px 9px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{background:var(--accent-soft)}
#app.slide-l{animation:slideL .24s ease-out}
#app.slide-r{animation:slideR .24s ease-out}
@keyframes slideL{from{transform:translateX(26px);opacity:.35}}
@keyframes slideR{from{transform:translateX(-26px);opacity:.35}}
.wfill{transition:transform 1.1s cubic-bezier(.34,1.35,.5,1)}
.wave{animation:wave 1.8s linear infinite}
@keyframes wave{to{transform:translateX(-19px)}}
@media (prefers-reduced-motion:reduce){#app.slide-l,#app.slide-r,.wave{animation:none}.wfill{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:6}
@media (max-width:420px){
  .food-form{grid-template-columns:1fr 70px 56px;}
  .food-form .btn{grid-column:1/-1}
  .macro-row{grid-template-columns:repeat(2,1fr)}
  .hist li{grid-template-columns:62px 1fr 42px 32px 32px 42px;font-size:12.5px}
}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
</style>
<style>
html{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button role="tab" data-tab="school"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg>School</button>
  <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Train</button>
  <button role="tab" data-tab="fuel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 3v18M17 21V3c-2.2 2-3.2 5-3.2 9H17"/></svg>Fuel</button>
  <button role="tab" data-tab="water"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.5 6-11z"/></svg>Water</button>
  <button role="tab" data-tab="glow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>Glow</button>
  <button role="tab" data-tab="bible"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M12 6.5v7M9.5 9h5"/></svg>Bible</button>
  <button role="tab" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg>Stats</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- program ---------- */
const DEFAULTS = { calBase: 2350, protein: 220, stepBase: 12000, bottle: 36 };
const WATER_GOAL = 128; // 1 gallon, in oz
const RAMBLERS = [18, 26, 36, 46, 64];
const waterOz = date => (getDay(date).water||[]).reduce((a,b)=>a+b,0);
const FLOOR_KCAL = 2000;

const SESSIONS = {
  upperA:{name:"Upper A · Chest & Delts",min:50,ex:[
    ["Incline DB press","4 × 6–8","Heavy. Leave 1–2 reps in the tank"],
    ["Seated DB shoulder press","3 × 8–10",""],
    ["Dips (assisted if needed) or deficit push-ups","3 × 8–12","Lean forward for chest"],
    ["Cable or DB lateral raise","4 × 12–15","Drop set on the last set"],
    ["Low-to-high cable fly","3 × 12–15","Upper-chest shelf"],
    ["Overhead rope triceps extension","3 × 10–12",""],
    ["Rope pushdown","2 × 15–20","To failure"],
    ["Neck curl, plate on forehead (lying on bench)","2 × 15","5–10 lb to start. Slow, no jerking"]]},
  lowerCore:{name:"Legs & Core",min:60,ex:[
    ["Romanian deadlift","4 × 8","Flat back, 2 reps in reserve. Never to failure"],
    ["Bulgarian split squat","3 × 10 / leg","Hold dumbbells once bodyweight is easy"],
    ["Leg press","3 × 12–15","Full range, don't lock out"],
    ["Seated or lying leg curl","3 × 12",""],
    ["Standing calf raise","4 × 12–15","Pause at the bottom"],
    ["Hanging knee raise","3 × 12–15","Slow lower"],
    ["Cable crunch","3 × 15",""],
    ["Incline walk, 10–12% @ 3.0 mph","20 min","Zone 2 to finish"]]},
  upperB:{name:"Upper B · Back & Arms",min:50,ex:[
    ["Pull-ups (band-assisted if needed) or lat pulldown","4 × 6–10","Full hang to chin over bar"],
    ["Chest-supported DB row","4 × 8–10","Pause at the top"],
    ["Single-arm cable row","3 × 10–12 / arm",""],
    ["Rear delt fly / reverse pec deck","4 × 15–20",""],
    ["Incline DB curl","3 × 10–12",""],
    ["Hammer curl","3 × 12","To failure on the last set"],
    ["Face pull","2 × 20",""],
    ["Neck extension, plate behind head (face down on bench)","2 × 15","5–10 lb to start. Slow, no jerking"]]},
  z2mob:{name:"Zone 2 + Mobility",min:45,ex:[
    ["Bike or rower, easy","30 min","HR 120–140"],
    ["Couch stretch","2 × 60 s / side",""],
    ["90/90 hip switches","2 × 10",""],
    ["Thoracic open books","2 × 10 / side",""],
    ["Dead hang","3 × 30 s","Shoulders and grip"]]},
  pump:{name:"Delts, Arms & Carries",min:45,ex:[
    ["Lateral raise, myo-reps","5 × 15","Rest 20 s between sets"],
    ["Machine or DB shoulder press","3 × 10–12",""],
    ["Cable Y-raise","3 × 15",""],

function totals(d){ const f=getDay(d).food; return {kcal:f.reduce((a,x)=>a+(+x.kcal||0),0),protein:f.reduce((a,x)=>a+(+x.p||0),0),logged:f.length>0}; }

function isDone(t, date, p){
  const d = getDay(date), tt = totals(date);
  if (t.id==="protein") return tt.protein >= p.protein - 10;
  if (t.id==="kcal") return tt.logged && tt.kcal <= p.kcal + 100;
  if (t.id==="sleeplog") return sleepHours(date)!=null;
  if (t.id==="water") return waterOz(date) >= WATER_GOAL;
  if (t.id==="bread") return !!(d.study||"").trim();
  if (t.id==="waist") return d.waist!=null;
  return !!d.tasks[t.id];
}

function evaluate(date){
  if (memo["e"+date]) return memo["e"+date];
  const p = plan(date), tt = totals(date);
  const req = p.tasks.filter(t=>!t.opt);
  const missed = req.filter(t=>!isDone(t,date,p)).map(t=>t.id);
  const e = {missed, pct:(req.length-missed.length)/req.length, ...tt};
  memo["e"+date] = e;
  return e;
}

// Calorie adjustment from the waist trend: every 14 days, comparing the latest
// Sunday measurement with the one two weeks earlier. A tape is too noisy week to week.
function waistNear(t, from, to){ for (let i=from;i<=to;i++){ const v=parseFloat(getDay(addDays(t,-i)).waist); if(!isNaN(v)) return v; } return null; }
function trendCheck(){
  const t = today();
  if (diffDays(settings.startDate,t) < 14) return false;
  if (settings.lastTrend && diffDays(settings.lastTrend,t) < 14) return false;
  const recent = waistNear(t,0,6), prior = waistNear(t,13,20);
  if (recent==null || prior==null) return false;
  memo = {};
  let adh = 0; for (let i=1;i<=14;i++) adh += evaluate(addDays(t,-i)).pct; adh/=14;
  const drop = prior - recent;
  let change = 0, why;
  const sl = []; for (let i=0;i<7;i++){ const h=sleepHours(addDays(t,-i)); if(h!=null) sl.push(h); }
  const avgSleep = sl.length>=4 ? sl.reduce((a,b)=>a+b,0)/sl.length : null;
  const d = `Waist ${drop>=0?"down":"up"} ${Math.abs(drop).toFixed(2)} in over 2 weeks.`;
  if (adh < 0.7) why = `${d} Checklist at ${Math.round(adh*100)}%. Calories stay put; hit the plan first.`;
  else if (drop < 0.25 && avgSleep!=null && avgSleep < 6.5) why = `${d} Sleep averaged ${fmtH(avgSleep)}. Calories stay put until sleep is back over 7 hours; poor sleep stalls fat loss on its own.`;
  else if (drop < 0.25) { change = -150; why = `${d} Stalled, so cutting 150 kcal.`; }
  else if (drop > 1.5) { change = 150; why = `${d} Faster than muscle can keep up with, so adding 150 kcal.`; }
  else why = `${d} Right on pace; no change.`;
  const next = Math.min(3200, Math.max(FLOOR_KCAL, settings.calBase + change));
  settings.log = [{date:t,drop:+drop.toFixed(2),change:next-settings.calBase,calBase:next,why}, ...(settings.log||[])].slice(0,26);
  settings.calBase = next; settings.lastTrend = t;
  return true;
}

/* ---------- persistence ---------- */
const writers = {};
function queueWrite(path, getData){
  cacheLocal();
  if (!db) return;
  const w = writers[path] || (writers[path] = {timer:null,inflight:false,again:false,dirty:false});
  w.dirty = true; clearTimeout(w.timer);
  w.timer = setTimeout(()=>flush(path,getData), 500);
}
async function flush(path, getData){
  const w = writers[path];
  if (w.inflight) { w.again = true; return; }
  w.inflight = true; w.dirty = false;
  const body = clone(getData());
  try { await db.doc(path).set(body); }
  catch(e){
    if (e && e.code==="unavailable") { await new Promise(r=>setTimeout(r,700+Math.random()*800)); try { await db.doc(path).set(body); } catch(e2){ toast("Couldn't sync. Saved on this device."); } }
    else if (e && e.code==="quota_exceeded") toast("Storage is full. Old days need clearing.");
    else toast("Couldn't sync. Saved on this device.");
  }
  w.inflight = false;
  if (w.again) { w.again = false; flush(path,getData); }
}

function markStreaks(){
  const t = today(), n = diffDays(settings.startDate, t);
  let run = 0, best = 0;
  for (let i=0;i<=n;i++){ const m = getDay(addDays(settings.startDate,i)).mark; if (m==="y") { run++; best=Math.max(best,run); } else if (i<n || m==="n") run = 0; }
  return {current: run, best};
}

/* ---------- the climb ---------- */
const PEAK = 84, PASS = 0.8;
function climb(){
  const t = today(), n = diffDays(settings.startDate, t);
  let pos = 0, streak = 0, best = 0, misses = 0, ups = 0, todayDone = false; const hist = [];
  for (let i=0;i<=n;i++){
    const dt = addDays(settings.startDate,i), ok = evaluate(dt).pct >= PASS;
    if (i<n) {
      if (ok) { pos = Math.min(PEAK,pos+1); streak++; ups++; } else { pos = Math.max(0,pos-2); streak = 0; misses++; }
    } else if (ok) { pos = Math.min(PEAK,pos+1); streak++; ups++; todayDone = true; }
    best = Math.max(best,streak);
    hist.push({date:dt, pos});
  }
  return {pos, streak, best, misses, ups, todayDone, hist};
}

function placeClimber(){
  const tr = document.getElementById("trail"), cl = document.getElementById("climber");
  if (!tr || !cl || !tr.getTotalLength) return;
  const L = tr.getTotalLength(), pos = +cl.dataset.pos, len = L*pos/PEAK, pt = tr.getPointAtLength(len);
  cl.setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
  document.getElementById("trailDone").setAttribute("stroke-dasharray", `${len.toFixed(1)} ${L.toFixed(1)}`);
  let camps = "";
  for (let k=1;k<12;k++){ const q = tr.getPointAtLength(L*k*7/PEAK), reached = pos >= k*7;
    camps += `<g transform="translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})"><line x1="0" y1="0" x2="0" y2="-9" stroke="var(--outline)" stroke-width="1.6"/><path d="M0.5 -9 L7 -6.5 L0.5 -4 Z" fill="${reached?"var(--plate-green)":"var(--snow)"}" stroke="var(--outline)" stroke-width="1.2"/></g>`; }
  document.getElementById("camps").innerHTML = camps;
  // Later days draw on top, so a step shows the most recent mark made there.
  const latest = new Map(); climbMarks.forEach(k=>latest.set(k.pos,k));
  document.getElementById("marks").innerHTML = [...latest.values()].map(k=>{
    const at = L*k.pos/PEAK, q = tr.getPointAtLength(at), q2 = tr.getPointAtLength(Math.min(L,at+1));
    let nx = -(q2.y-q.y), ny = q2.x-q.x; const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    const side = k.pos%2 ? 1 : -1, x=(q.x+nx*8*side).toFixed(1), y=(q.y+ny*8*side).toFixed(1);
    return k.m==="y"
      ? `<g transform="translate(${x} ${y})"><circle r="4.2" fill="var(--plate-green)" stroke="var(--outline)" stroke-width="1.2"/><path d="M-2 0.1 L-0.5 1.6 L2.1 -1.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>`
      : `<g transform="translate(${x} ${y})"><circle r="4.2" fill="var(--plate-red)" stroke="var(--outline)" stroke-width="1.2"/><path d="M-1.6 -1.6 L1.6 1.6 M1.6 -1.6 L-1.6 1.6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></g>`; }).join("");
}

function ramblerSVG(from, to, i, h){
  // Cartoon Rambler bottle. The water group slides from `from` to `to` (0..1 full).
  const H = 96*h, top = 104-H, bodyTop = top+16, bodyH = 104-bodyTop;
  const off = f => ((1-f)*(bodyH+6)).toFixed(1);
  let wave = `M-40 ${bodyTop}`; for (let x=-40;x<100;x+=19) wave += ` q4.75 -3 9.5 0 t9.5 0`;
  return `<svg viewBox="0 0 60 112" width="54" height="100" aria-hidden="true">
    <defs><clipPath id="bc${i}"><rect x="11" y="${bodyTop}" width="38" height="${bodyH}" rx="9"/></clipPath></defs>
    <rect x="11" y="${bodyTop}" width="38" height="${bodyH}" rx="9" fill="var(--surface)"/>
    <g clip-path="url(#bc${i})"><g class="wfill" style="transform:translateY(${off(from)}px)" data-to="${off(to)}">
      <rect x="0" y="${bodyTop}" width="60" height="${bodyH+10}" fill="var(--plate-blue)" opacity=".85"/>
      <path class="wave" d="${wave} V ${bodyTop+6} H -40 Z" fill="var(--plate-blue)"/>
      <path class="wave" d="${wave}" fill="none" stroke="var(--snow)" stroke-width="1.4" opacity=".6"/>
    </g></g>
    <rect x="11" y="${bodyTop}" width="38" height="${bodyH}" rx="9" fill="none" stroke="var(--outline)" stroke-width="2.5"/>
    <rect x="17" y="${top+4}" width="26" height="13" rx="4" fill="var(--mtn)" stroke="var(--outline)" stroke-width="2.5"/>
    <path d="M22 ${top+5} Q30 ${top-8} 38 ${top+5}" fill="none" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="16" y="${bodyTop+8}" width="5" height="${Math.max(10,bodyH*.45)}" rx="2.5" fill="var(--snow)" opacity=".55"/>
  </svg>`;
}

      <li><b>Pre-class (4:55 AM):</b> no food. Just a few sips of water with a pinch of salt so you don't cramp. If coffee on an empty stomach makes you queasy, save it for after class. If you ever get dizzy or shaky mid-workout, sit down, and bring a small juice box to keep in your bag for that.</li>
      <li><b>Post-class (7:00 AM):</b> the egg scramble and oats, about 50 g protein. Eat it within 45 minutes, since you trained on an empty stomach.</li>
      <li><b>Daily:</b> 10 min of mobility, 1 gallon of water, magnesium glycinate at night (optional).</li>
      <li><b>Sunday:</b> full rest from hard training. Walk, stretch, meal prep. Sauna 15–20 min if your gym has one.</li>
      <li><b>Weekly:</b> check resting heart rate first thing Monday. <b>Red flags:</b> resting heart rate up 7+ bpm for 3 days, lifts going backward, or bad sleep for 3 nights. Take an extra rest day. Chest pain or dizziness means stop and see a doctor.</li>
    </ul>
  </section>`;
}

function sparkline(){
  const N=84, pts=[]; for(let i=N-1;i>=0;i--){ const dt=addDays(today(),-i), w=parseFloat(getDay(dt).waist); if(!isNaN(w)) pts.push([N-1-i,w]); }
  if (pts.length<2) return `<p class="muted">Measure your waist at the navel each Sunday and your 12-week trend shows up here. A $3 cloth tape measure is all you need.</p>`;
  const ws=pts.map(p=>p[1]), lo=Math.floor(Math.min(...ws)-1), hi=Math.ceil(Math.max(...ws)+1);
  const W=320,H=120,L=36,R=8,T=10,B=20;
  const x=i=>L+i/(N-1)*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const area=`${line} L${x(pts[pts.length-1][0]).toFixed(1)},${H-B} L${x(pts[0][0]).toFixed(1)},${H-B} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Waist measurements over the last 12 weeks">
    <line x1="${L}" x2="${W-R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${y(hi)+4}" text-anchor="end">${hi}"</text>
    <text x="${L-6}" y="${y(lo)+4}" text-anchor="end">${lo}"</text>
    <text x="${L}" y="${H-4}">12 wk ago</text><text x="${W-R}" y="${H-4}" text-anchor="end">today</text>
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join("")}
  </svg>`;
}

function bodySummary(){

  const vals = dates.map(k=>parseFloat(days[k].waist)).filter(v=>!isNaN(v));

  const a0=vals[0], a1=vals[vals.length-1];
  return `<p style="font-size:14px"><b>Now</b> <span class="num">${a1}"</span>${a1!==a0?` <span class="muted num">(${a1<a0?"−":"+"}${Math.abs(a1-a0).toFixed(2)}" since start)</span>`:""}</p>`;
}

function sleepChart(){
  const t = today(), n = 14, vals = [];
  for (let i=n-1;i>=0;i--){ const dt=addDays(t,-i); vals.push([dt, sleepHours(dt), getDay(dt).sleep?.q]); }
  const logged = vals.filter(v=>v[1]!=null);
  const last7 = vals.slice(-7).filter(v=>v[1]!=null).map(v=>v[1]);
  const avg = last7.length ? last7.reduce((a,b)=>a+b,0)/last7.length : null;
  const head = `<div class="spread"><h2>Sleep, 14 nights</h2><span class="num muted" style="font-size:13px">7-night avg ${avg==null?"–":fmtH(avg)}</span></div>`;
  if (!logged.length) return head + `<p class="muted">Log bedtime and wake time in the morning check-in, and your nights show up here. Target: 7.5 hours or more.</p>`;
  const W=320,H=130,L=26,R=6,T=8,B=20,max=10, slot=(W-L-R)/n, bw=slot*0.62;
  const y = v => T+(max-v)/max*(H-T-B);
  const bars = vals.map((v,i)=>{ if(v[1]==null) return ""; const h=Math.min(v[1],max), x=L+i*slot+(slot-bw)/2;
    const c = v[1]<6?"var(--bad)":v[1]<7?"var(--warn)":"var(--accent)";
    return `<rect x="${x.toFixed(1)}" y="${y(h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(h)).toFixed(1)}" rx="2" fill="${c}"><title>${short(v[0])}: ${fmtH(v[1])}${v[2]?` · quality ${v[2]}/5`:""}</title></rect>`; }).join("");
  return head + `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hours slept for the last 14 nights">
    ${[0,5,10].map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${y(g)+4}" text-anchor="end">${g}h</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${y(7.5)}" y2="${y(7.5)}" stroke="var(--good)" stroke-dasharray="4 3"/>
    <text x="${W-R}" y="${y(7.5)-4}" text-anchor="end">7.5h target</text>
    ${bars}
    <text x="${L}" y="${H-4}">14 nights ago</text><text x="${W-R}" y="${H-4}" text-anchor="end">last night</text>
  </svg>`;
}

  </section>`}`;

// Replacing the DOM can blur a focused input, which fires "change" and asks for
// another render mid-render. Defer those instead of nesting.
let rendering = false;
function render(){
  if (rendering) { queueMicrotask(render); return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow(){
  memo = {};
  const app = $("#app");
  const views = {today:viewToday, plan:viewPlan, fuel:viewFuel, water:viewWater, school:viewSchool, glow:viewGlow, bible:viewBible, progress:viewProgress};
  app.innerHTML = `<div class="stack">${(views[tab]||viewToday)()}</div>`;
  placeClimber();
  if (shakeMark) { const b = document.querySelector(`[data-mark="${shakeMark}"]`); if (b) b.classList.add("shake"); shakeMark = null; }
  animateWater();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
}


/* ---------- haptics ---------- */
// Android: the Vibration API. iPhone Safari has no Vibration API, but toggling a
// native switch control gives a system tap, so we click a hidden one.
const hapticSwitch = (()=>{ try {
  const l = document.createElement("label"); l.setAttribute("aria-hidden","true");
  l.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none";
  const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch",""); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l); return l; } catch(e){ return null; } })();
function haptic(strong){
  try { if (navigator.vibrate) navigator.vibrate(strong ? [14,50,14] : 12); } catch(e){}
  try { if (hapticSwitch) { hapticSwitch.click(); if (strong) setTimeout(()=>hapticSwitch.click(), 90); } } catch(e){}
}
let shakeMark = null;
let pendingRestore = null;

function markSleepEdited(){
  const b = document.querySelector("[data-save-sleep]"); if (!b) return;
  b.disabled = false; b.classList.remove("saved"); b.textContent = "Save sleep";
}

/* ---------- events ---------- */
const ORDER = ["today","school","plan","fuel","water","glow","bible","progress"];
function goTab(next){
  if (next===tab || !ORDER.includes(next)) return;
  const dir = ORDER.indexOf(next) > ORDER.indexOf(tab) ? "slide-l" : "slide-r";
  tab = next; try{ localStorage.setItem(LS_KEY+":tab",tab); }catch(err){}
  viewDate = today();
  render(); window.scrollTo(0,0);
  const a = document.getElementById("app"); a.classList.remove("slide-l","slide-r"); void a.offsetWidth; a.classList.add(dir);
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]"); if(b) goTab(b.dataset.tab);
});
// Swipe left/right anywhere on the page to change tabs. Gestures that start on
// inputs or horizontally scrolling areas are left alone.
let sw = null;
document.addEventListener("touchstart", e=>{
  if (e.touches.length!==1 || e.target.closest("input,textarea,select,[data-noswipe],.tablewrap")) { sw=null; return; }
  sw = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()};
}, {passive:true});
document.addEventListener("touchend", e=>{
  if (!sw) return;
  const dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y, dt = Date.now()-sw.t; sw = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.6 || dt > 700) return;
  const i = ORDER.indexOf(tab) + (dx < 0 ? 1 : -1);
  if (i>=0 && i<ORDER.length) goTab(ORDER[i]);
}, {passive:true});
const app = document.getElementById("app");
app.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if (nav) { const n=addDays(viewDate,+nav.dataset.nav); if (diffDays(n,today())>=0) { viewDate=n; render(); } return; }
  const wb = e.target.closest("[data-water]");
  if (wb) { haptic(); const t=today(); if(!days[t]) days[t]=emptyDay(); days[t].water=[...(days[t].water||[]), +wb.dataset.water]; saveDay(t); render(); toast(`+${wb.dataset.water} oz`); return; }
  if (e.target.closest("[data-water-undo]")) { haptic(); const t=today(); const w=(days[t]&&days[t].water)||[]; if(w.length){ days[t].water=w.slice(0,-1); saveDay(t); render(); } return; }
  const dl = e.target.closest("[data-del]");
  if (dl) { pendingDel = dl.dataset.del; render(); return; }
  const dy = e.target.closest("[data-del-yes]");
  if (dy) { haptic(true); academics.items = (academics.items||[]).filter(a=>a.id!==dy.dataset.delYes); pendingDel=null; saveAcademics(); render(); toast("Deleted"); return; }
  if (e.target.closest("[data-del-no]")) { pendingDel=null; render(); return; }
  if (e.target.closest("[data-backup]")) {
    haptic();
    const blob = new Blob([JSON.stringify({app:"the-climb", saved:today(), days, settings, academics, wods}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `the-climb-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("Backup saved to your Files"); return;
  }
  if (e.target.closest("[data-restore-yes]") && pendingRestore) {
    const b = pendingRestore; days = b.days||{}; settings = {...DEFAULTS, ...(b.settings||{})}; academics = b.academics||{items:[]}; wods = b.wods||{};
    pendingRestore = null; cacheLocal(); haptic(true); render(); toast("Backup restored"); return;
  }
  if (e.target.closest("[data-restore-no]")) { pendingRestore = null; render(); return; }
  const gs = e.target.closest("[data-glow]");
  if (gs) { glowSec = gs.dataset.glow; try{ localStorage.setItem(LS_KEY+":glow",glowSec); }catch(err){} render(); return; }
  if (e.target.closest("[data-save-sleep]")) {
    const bed = $("#sBed").value, wake = $("#sWake").value, q = $("#sQ").value;
    if (!bed || !wake) { toast("Set both bedtime and wake time"); return; }
    if(!days[viewDate]) days[viewDate]=emptyDay();
    days[viewDate].sleep = {bed, wake, q: q ? +q : null};
    haptic(true); saveDay(viewDate); render(); toast(`Sleep logged: ${fmtH(sleepHours(viewDate))}`); return;
  }
  const mk = e.target.closest("[data-mark]");
  if (mk) { haptic(mk.dataset.mark==="n"); shakeMark = mk.dataset.mark; if(!days[viewDate]) days[viewDate]=emptyDay(); const v=mk.dataset.mark; days[viewDate].mark = days[viewDate].mark===v ? null : v; saveDay(viewDate); render(); return; }
  const bb = e.target.closest("[data-bottle]");
  if (bb) { haptic(); settings.bottle = +bb.dataset.bottle; saveSettings(); render(); return; }
  const pr = e.target.closest("[data-preset]");
  if (pr) { const x=PRESETS[+pr.dataset.preset]; addFood(x[0],x[1],x[2]); return; }
  const del = e.target.closest("[data-delfood]");
  if (del) { const d=days[viewDate]; if(!d) return; d.food.splice(+del.dataset.delfood,1); saveDay(viewDate); render(); }
});
app.addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset.task) { haptic(t.checked); if(!days[viewDate]) days[viewDate]=emptyDay(); days[viewDate].tasks[t.dataset.task]=t.checked; saveDay(viewDate); render(); return; }
  if (t.id==="waist") { haptic(); if(!days[viewDate]) days[viewDate]=emptyDay(); const v=parseFloat(t.value); days[viewDate].waist = isNaN(v)?null:v; saveDay(viewDate); render(); return; }
  // Time wheels fire "change" on every stop, so only flag the edit here.
  // Nothing saves until "Save sleep" is tapped.
  if (t.id==="sBed" || t.id==="sWake" || t.id==="sQ") { markSleepEdited(); return; }
  if (t.id==="restoreFile" && t.files && t.files[0]) {
    t.files[0].text().then(txt=>{ try { const b = JSON.parse(txt); if (b.app!=="the-climb" || !b.days) throw 0; pendingRestore = b; render(); }
      catch(err){ toast("That file isn't a Climb backup"); } });
    return;
  }
  if (t.dataset.grade) { haptic(); const a=(academics.items||[]).find(x=>x.id===t.dataset.grade); if(a){ a.grade=t.value.trim(); saveAcademics(); toast("Grade saved"); } return; }
  if (t.id==="study") { haptic(true); if(!days[viewDate]) days[viewDate]=emptyDay(); days[viewDate].study=t.value.trim(); saveDay(viewDate); render(); return; }
  if (t.id==="journal") { if(!days[viewDate]) days[viewDate]=emptyDay(); days[viewDate].journal=t.value; saveDay(viewDate); return; }
  if (t.id==="wodNote") { if(!days[viewDate]) days[viewDate]=emptyDay(); days[viewDate].wod=t.value; saveDay(viewDate); return; }
  const num = v => { const n=parseInt(v,10); return isNaN(n)?null:n; };
  if (t.id==="sCal" && num(t.value)) { settings.calBase=Math.max(FLOOR_KCAL,num(t.value)); saveSettings(); toast("Calorie target saved"); }
  if (t.id==="sP" && num(t.value)) { settings.protein=num(t.value); saveSettings(); toast("Protein target saved"); }
  if (t.id==="sSteps" && num(t.value)) { settings.stepBase=num(t.value); saveSettings(); toast("Step goal saved"); }
  if (t.id==="sStart" && t.value && diffDays(t.value,today())>=0) { settings.startDate=t.value; saveSettings(); render(); toast("Start date saved"); }
});
app.addEventListener("submit", e=>{
  if (e.target.id==="assessForm") { haptic(true);
    e.preventDefault();
    const title=$("#aTitle").value.trim(), due=$("#aDue").value;
    if (!title || !due || diffDays(today(),due)<0) { toast("Pick a due date from today on"); return; }
    academics.items = [...(academics.items||[]), {id:Date.now().toString(36), title, cls:$("#aClass").value.trim(), type:$("#aType").value, due, created:today()}];
    saveAcademics(); render(); toast(`Added. Study plan built for ${title}`); return;
  }
  if (e.target.id!=="foodForm") return;
  e.preventDefault();
  const n=$("#fName").value.trim(), k=parseInt($("#fKcal").value,10), p=parseInt($("#fP").value,10)||0;
  if (!n || isNaN(k)) return;
  addFood(n,k,p);
});
function addFood(name,kcal,p){
  haptic();
  if(!days[viewDate]) days[viewDate]=emptyDay();
  days[viewDate].food.push({name,kcal,p});
  saveDay(viewDate); render(); toast(`Added ${name}`);
}

/* ---------- boot ---------- */
render();
try { if (!localStorage.getItem(LS_KEY+":swipehint")) { localStorage.setItem(LS_KEY+":swipehint","1"); setTimeout(()=>toast("Tip: swipe left or right to switch tabs"), 900); } } catch(e){}
(async()=>{
  try { db = window.claude && await window.claude.use("db"); } catch(e){ db = null; }
  if (!db) { render(); return; }
  let gotSettings = false;
  db.doc("settings/profile").onSnapshot(snap=>{
    if (busy("settings/profile")) return;
    if (snap.exists) { settings = {...DEFAULTS, ...settings, ...clone(snap.data())}; }
    else if (!gotSettings && !snap.metadata.fromCache) { saveSettings(); }
    if (!snap.metadata.fromCache) gotSettings = true;
    memo = {}; if (gotSettings && trendCheck()) saveSettings();
    cacheLocal(); render();
  }, ()=>{});
  db.collection("days").onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if (!busy("days/"+d.id)) days[d.id] = clone(d.data()); });
    cacheLocal(); render();
  }, ()=>{});
  db.doc("academics/main").onSnapshot(snap=>{
    if (busy("academics/main")) return;
    if (snap.exists) academics = {items:[], ...clone(snap.data())};
    cacheLocal(); render();
  }, ()=>{});
  db.doc("plan/wods").onSnapshot(snap=>{
    wods = snap.exists ? clone(snap.data().days||{}) : {};
    cacheLocal(); render();
  }, ()=>{});
  render();
})();
// Roll over to the new day if the app stays open past midnight.
setInterval(()=>{ if (tab==="today" && viewDate!==today() && diffDays(viewDate,today())===1 && document.visibilityState==="visible") { viewDate=today(); render(); } }, 60000);
</script>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
